<script id="i18n-base">
/* tiny i18n + router scaffold; content modules attach renderers via window.ZW */
window.ZW = window.ZW || { lang: 'zh', renderers: {}, data: {} };

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
window.ZW.esc = esc;

const VIEWS = ['zero','log','code','daoist','builder'];

function switchTab(name){
  if(!VIEWS.includes(name)) name = 'zero';
  VIEWS.forEach(v=>{
    const el = document.getElementById(v);
    if(el) el.classList.toggle('hidden', v!==name);
  });
  document.querySelectorAll('[data-tab]').forEach(a=>{
    a.classList.toggle('tab-active', a.dataset.tab===name);
  });
  window.scrollTo({top:0,behavior:'instant'});
  if(history.replaceState) history.replaceState(null,'','#'+name);
  // builder forced English regardless of global
  renderAll();
}
window.ZW.switchTab = switchTab;

function renderAll(){
  VIEWS.forEach(v=>{
    const fn = window.ZW.renderers[v];
    const el = document.getElementById(v);
    if(fn && el) el.innerHTML = fn(window.ZW.lang);
  });
}
window.ZW.renderAll = renderAll;

document.addEventListener('click', e=>{
  const a = e.target.closest('[data-tab]');
  if(!a) return;
  e.preventDefault();
  switchTab(a.dataset.tab);
});

document.addEventListener('DOMContentLoaded', ()=>{
  // restore language
  try {
    const saved = localStorage.getItem('zw_lang');
    if(saved === 'en' || saved === 'zh') window.ZW.lang = saved;
  } catch(_){}
  const btn = document.getElementById('lang-toggle');
  if(btn){
    btn.addEventListener('click', ()=>{
      window.ZW.lang = (window.ZW.lang === 'zh') ? 'en' : 'zh';
      try { localStorage.setItem('zw_lang', window.ZW.lang); } catch(_){}
      document.documentElement.lang = (window.ZW.lang==='en')?'en':'zh-CN';
      renderAll();
    });
  }
  document.documentElement.lang = (window.ZW.lang==='en')?'en':'zh-CN';
  const initial = (location.hash||'#zero').replace('#','');
  switchTab(initial);
});
</script>
