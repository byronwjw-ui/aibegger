/* ====== ESCAPE ====== */
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

        <div class="mb-6 flex items-center gap-4 text-sm text-gold">
          <span class="font-mono">P${String(s.page).padStart(2,'0')}</span>
          <span class="h-px flex-1 bg-gold/30"></span>

        <h2 class="text-4xl font-black leading-tight md:text-5xl">${esc(s.title)}</h2>

        <ul class="mt-10 space-y-4">

/* ====== TAB SWITCH ====== */
const views = ['hero','ppt','manual','tables'];
function switchTab(name){
  if(!views.includes(name)) name = 'hero';
  views.forEach(v=>{
    const el = document.getElementById(v);
    if(el) el.classList.toggle('hidden', v!==name);
  });
  document.querySelectorAll('[data-tab]').forEach(a=>{
    a.classList.toggle('tab-active', a.dataset.tab===name);
  });
  window.scrollTo({top:0,behavior:'instant'});
  if(history.replaceState) history.replaceState(null,'','#'+name);
}
document.addEventListener('click',e=>{
  const a = e.target.closest('[data-tab]');
  if(!a) return;
  e.preventDefault();
  switchTab(a.dataset.tab);
});

/* ====== INIT ====== */
renderPPT();
renderManual();
renderTables();
const initial = (location.hash||'#hero').replace('#','');
switchTab(initial);
